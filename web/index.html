<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="County-level US corn and soybean yield analytics and in-season forecasts."
    />

    <!-- Social preview. og:image must be an absolute URL: the sites that
         unfurl these links fetch them from their own servers, where a
         relative path resolves to nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeepHarvest" />
    <meta property="og:title" content="DeepHarvest" />
    <meta
      property="og:description"
      content="County-level US corn and soybean yield analytics and in-season forecasts."
    />
    <meta property="og:url" content="https://deepharvest.vercel.app/" />
    <meta property="og:image" content="https://deepharvest.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DeepHarvest showing a county-level map of forecast soybean production across the United States."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeepHarvest" />
    <meta
      name="twitter:description"
      content="County-level US corn and soybean yield analytics and in-season forecasts."
    />
    <meta name="twitter:image" content="https://deepharvest.vercel.app/og.png" />

    <title>DeepHarvest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
